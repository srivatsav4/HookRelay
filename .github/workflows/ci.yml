name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && ruff check app tests
      - run: cd backend && python -m pytest tests/unit tests/security -q
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: hookrelay, POSTGRES_PASSWORD: hookrelay, POSTGRES_DB: hookrelay_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hookrelay" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://hookrelay:hookrelay@localhost:5432/hookrelay_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-jwt-secret-0123456789
      API_KEY_PEPPER: ci-pepper-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest tests -q
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: hookrelay, POSTGRES_PASSWORD: hookrelay, POSTGRES_DB: hookrelay}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hookrelay" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://hookrelay:hookrelay@localhost:5432/hookrelay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements.txt
      - run: cd backend && alembic upgrade head && alembic downgrade base && alembic upgrade head
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose build
