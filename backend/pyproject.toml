[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs real PostgreSQL + Redis (DATABASE_URL / REDIS_URL)",
]

[tool.ruff]
line-length = 130
target-version = "py311"
