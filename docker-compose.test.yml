services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: hookrelay, POSTGRES_PASSWORD: hookrelay, POSTGRES_DB: hookrelay_test}
    ports: ["55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay_test"], interval: 2s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 3s, retries: 20}
